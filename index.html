<!DOCTYPE html>
<html>
<head>
  <title>Student Information System</title>
  <link rel="stylesheet" href="frontend/style.css">
</head>
<body>
  <div id="loginPage">
    <h1>Student Information System</h1>
    <form id="loginForm">
      <select id="role">
        <option value="student">Student</option>
        <option value="lecturer">Lecturer</option>
        <option value="admin">Admin</option>
      </select>
      <input type="text" id="username" placeholder="Enter your username">
      <input type="password" id="password" placeholder="Enter your password">
      <button type="submit">Login</button>
    </form>
    <p id="loginStatus"></p>
  </div>

  <div class="app-container" id="mainApp" style="display:none;">
  <aside class="sidebar">
    <div class="logo">SIS Portal</div>
    <nav>
      <button onclick="showPage('dashboard')" class="nav-item active">Dashboard</button>
      <button onclick="showPage('students')" class="nav-item active">Manage Students</button>
      <button onclick="showPage('courses')" class="nav-item active">Manage Courses</button>
      <button onclick="showPage('announcements')" class="nav-item active">Announcements</button>
      <button onclick="showPage('settings')" class="nav-item active">Settings</button>
    </nav>
  </aside>
 
  <main class="content">
    <header class="top-bar">
      <h1>Dashboard</h1>
      <div class="user-profile">Student User</div>
    </header>

  <div id="dashboard" class="page">
     <section class="stats-grid">
        <div class="card">
          <h3>Enrolled Courses</h3>
          <p id="totalCourses">0</p> </div>
        <div class="card">
          <h3>Current GPA</h3>
          <p>3.80</p>
        </div>
        <div class="card">
            <h3>Attendance</h3>
            <p id="avgAttendance">93%</p> </div>
    </section>

    <section class="charts-grid">
      <div class="card chart">
        <h3>GPA Trend</h3>
        <canvas id="gpaChart"></canvas>
      </div>
    </section>
  </div>

  <div id="students" class="page" style="display:none;">
    <h2>Manage Students</h2>
    <form id="studentForm">
      <input type="text" id="id" placeholder="Student ID">
      <input type="text" id="name" placeholder="Name">
      <input type="text" id="course" placeholder="Course">
      <button type="submit">Add Student</button>
    </form>
    <table id="studentTable"></table>
  </div>

  <div id="courses" class="page" style="display:none;">
    <h2>Manage Courses</h2>
    <form id="courseForm">
      <input type="text" id="courseId" placeholder="Course ID">
      <input type="text" id="courseName" placeholder="Course Name">
      <input type="text" id="instructor" placeholder="Instructor">
      <input type="number" id="credits" placeholder="Credits">
      <button type="submit">Add Course</button>
    </form>
    <table id="courseTable"></table>
  </div>

  <div id="announcements" class="page" style="display:none;">
    <h2>Announcements</h2>
    <form id="announcementForm">
      <input type="text" id="announcementId" placeholder="ID">
      <input type="text" id="announcementTitle" placeholder="Title">
      <input type="text" id="announcementDesc" placeholder="Description">
      <button type="submit">Post Announcement</button>
    </form>
    <ul id="announcementList"></ul>
  </div>

  <div id="settings" class="page" style="display:none;">
    <h2>Settings</h2>
    <label><input type="checkbox" id="darkMode"> Enable Dark Mode</label><br>
    <label><input type="checkbox" id="notifications"> Enable Notifications</label><br>
    <button onclick="saveSettings()">Save Settings</button>
  </div>
  
  </main>
</div>
  <script src="frontend/script.js"></script>
</body>
</html>
