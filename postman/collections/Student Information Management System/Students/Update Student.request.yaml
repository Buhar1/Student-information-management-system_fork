$kind: http-request
name: Update Student
method: PUT
url: '{{baseUrl}}/students/1'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "student": {
        "name": "John Doe",
        "email": "john@example.com",
        "course": "Software Engineering"
      }
    }
